services:
  ch:
    image: clickhouse/clickhouse-server:26.3.17.110
    container_name: ch-storage-lab
    ports:
      # Deliberately off the defaults (8123/9000) so this lab can run
      # alongside another local ClickHouse without a port clash.
      - "${CH_HTTP_PORT:-8124}:8123"
      - "${CH_NATIVE_PORT:-9001}:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch-storage-lab:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  ch-storage-lab:
