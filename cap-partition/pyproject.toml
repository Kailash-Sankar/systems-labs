[project]
name = "cap-partition"
version = "0.1.0"
description = "Hands-on lab: CAP, PACELC, and quorum tradeoffs with scripted network partitions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cap_partition"]

[tool.uv]
dev-dependencies = [
    "matplotlib>=3.10.0",
    "ruff>=0.9.0",
]
