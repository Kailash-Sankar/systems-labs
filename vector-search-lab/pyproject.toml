[project]
name = "vector-search-lab"
version = "0.1.0"
description = "Hands-on lab for embeddings, vector search, and RAG — index markdown corpora locally"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.6.0,<1",
    "sqlite-vec>=0.1.9",
    "qdrant-client>=1.12.0",
    "pymilvus>=2.5.0",
    "redis>=5.2.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_search_lab"]
force-include = { "src/vector_search_lab/web/static" = "vector_search_lab/web/static" }

[tool.uv]
dev-dependencies = [
    "ruff>=0.9.0",
]
